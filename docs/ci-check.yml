name: Standalone checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        cc: [clang, gcc]
        exclude:
          - os: macos-latest
            cc: gcc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-workspace.py
      - run: make -j2 CC=${{ matrix.cc }} all
      - run: make CC=${{ matrix.cc }} check
      - run: make CC=${{ matrix.cc }} sanitize
      - run: make CC=${{ matrix.cc }} smoke
